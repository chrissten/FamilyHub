<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FamilyHub{% endblock %}</title>
  <link rel="icon" href="/static/img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16.png">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://unpkg.com/htmx-ext-ws@2.0.1/ws.js"></script>
  <script src="/static/js/time-picker.js?v={{ js_asset_version }}" defer></script>
  <script src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js" defer></script>
  <script>
    // Lets the server render event times in this browser's own timezone (see
    // app/routers/calendar.py's _viewer_tz) without needing a login-time preference.
    document.cookie = "tz=" + encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone)
      + ";path=/;max-age=31536000;samesite=lax";
  </script>
</head>
<body>
  {% if current_user %}
  <nav class="topnav">
    <div class="brand">FamilyHub</div>
    <a href="/calendar">Calendar</a>
    <a href="/grocery">Grocery</a>
    <a href="/todo">To-Do</a>
    <a href="/freezer">Freezer</a>
    {% if current_user.is_admin %}<a href="/users">Family</a>{% endif %}
    <span class="spacer"></span>
    <a href="/profile" class="who" style="border-color: {{ current_user.color_hex }}">{{ current_user.display_name }}</a>
    <a href="/logout">Logout</a>
  </nav>
  {% endif %}
  <main class="{% block main_class %}container{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
