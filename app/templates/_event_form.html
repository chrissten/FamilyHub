<h2>{{ "Edit event" if event else "New event" }}</h2>
<form
  x-data="{ allDay: {{ 'true' if event and event.all_day else 'false' }} }"
  hx-post="{{ '/calendar/events/' + event.id|string if event else '/calendar/events' }}"
  hx-target="#calendar-view" hx-swap="innerHTML"
  hx-on::after-request="if(event.detail.successful) window.dispatchEvent(new Event('close-modal'))">
  <input type="hidden" name="return_view" value="{{ return_view }}">
  <input type="hidden" name="return_date" value="{{ return_date }}">
  <label>Title<input type="text" name="title" value="{{ event.title if event else '' }}" required></label>
  <label>Description<textarea name="description">{{ event.description if event else '' }}</textarea></label>
  <label>Location<input type="text" name="location" value="{{ event.location if event else '' }}"></label>
  <label>Start date
    <input type="date" name="start_date"
           value="{{ event.start_time.date().isoformat() if event else default_date }}" required>
  </label>
  <label class="inline">
    <input type="checkbox" name="all_day" value="true" x-model="allDay">
    All day
  </label>
  <label x-cloak x-show="allDay">End date
    <input type="date" name="end_date"
           value="{{ event.end_time.date().isoformat() if event else default_date }}">
  </label>
  <label x-cloak x-show="!allDay">Start time<input type="time" name="start_time_str" value="{{ event.start_time.strftime('%H:%M') if event else '09:00' }}"></label>
  <label x-cloak x-show="!allDay">End time<input type="time" name="end_time_str" value="{{ event.end_time.strftime('%H:%M') if event else '10:00' }}"></label>
  <label class="attendees-label">
    Attendees
    <button type="button" class="link-button"
            @click="$el.closest('form').querySelectorAll('.member-checkbox').forEach(cb => cb.checked = true)">All</button>
  </label>
  <div class="attendee-checkboxes">
    {% for member in members %}
    <label class="inline">
      <input type="checkbox" class="member-checkbox" name="attendee_ids" value="{{ member.id }}"
             {% if event and member in event.attendees %}checked
             {% elif not event and member.id == current_user.id %}checked{% endif %}>
      <span class="swatch" style="background-color: {{ member.color_hex }}"></span>
      {{ member.display_name }}
    </label>
    {% endfor %}
  </div>
  <div class="form-actions">
    <button type="submit">{{ "Save" if event else "Add event" }}</button>
    <button type="button" @click="modalOpen = false">Cancel</button>
    {% if event %}
    <button type="button" class="danger"
            hx-post="/calendar/events/{{ event.id }}/delete"
            hx-target="#calendar-view" hx-swap="innerHTML"
            hx-on::after-request="window.dispatchEvent(new Event('close-modal'))">Delete</button>
    {% endif %}
  </div>
</form>
