{% extends "base.html" %}
{% block title %}{{ freezer.name }} - FamilyHub{% endblock %}
{% block content %}
<p><a href="/freezer">&laquo; All freezers</a></p>
<h1>{{ freezer.name }}</h1>

<section class="grocery-category">
  <ul id="freezer-items" hx-ext="ws" hx-ws="connect:/ws/freezer/{{ freezer.id }}">
    {% for item in items %}
      {% include "_freezer_item_row.html" %}
    {% endfor %}
  </ul>
  <form class="add-item-form" hx-post="/freezer/freezers/{{ freezer.id }}/items" hx-target="this" hx-swap="none"
        hx-on::after-request="if(event.detail.successful) this.reset()">
    <input type="text" name="name" placeholder="Item" required>
    <input type="text" name="quantity" placeholder="Qty" class="qty">
    <label class="inline">Purchased <input type="date" name="date_purchased"></label>
    <label class="inline">Expires <input type="date" name="expiration_date"></label>
    <button type="submit">Add</button>
  </form>
</section>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>
<script>
var freezerItems = document.getElementById('freezer-items');
if (freezerItems) {
  new Sortable(freezerItems, {
    handle: '.drag-handle',
    animation: 150,
    ghostClass: 'sortable-ghost',
    onEnd: function() {
      var freezerId = {{ freezer.id }};
      var ids = Array.from(freezerItems.querySelectorAll(':scope > .grocery-item')).map(function(li) {
        return parseInt(li.id.replace('freezer-item-', ''));
      });
      fetch('/freezer/freezers/' + freezerId + '/items/reorder', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({item_ids: ids})
      });
    }
  });
}
</script>
{% endblock %}
