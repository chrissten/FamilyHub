{% extends "base.html" %}
{% block title %}Calendar - FamilyHub{% endblock %}
{% block content %}
<div x-data="{ modalOpen: false }" @close-modal.window="modalOpen = false">
  <div id="calendar-view">
    {% include partial %}
  </div>

  <div class="modal-backdrop" x-show="modalOpen" x-cloak @click.self="modalOpen = false" style="display: none;">
    <div class="modal" id="modal-content"></div>
  </div>
</div>
{% endblock %}
